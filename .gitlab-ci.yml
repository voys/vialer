workflow:
  rules:
    - if: $CI_MERGE_REQUEST_IID

stages:
  - static analysis
  - build and test

.flutter:
  image:
    name: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/gmeligio/flutter-android:3.38.7
    docker:
      # The image defaults to a non-root user, but the runner checks out the
      # repo as root, leaving files the image's user doesn't own (e.g. pub
      # fails to update pubspec.lock's modification time). Run as root instead.
      user: root
  before_script:
    # Since we run as root, git refuses to touch the flutter-user-owned SDK.
    - git config --global --add safe.directory "$FLUTTER_ROOT"
  timeout: 1 hour
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"'
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"'
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'

format:
  extends: .flutter
  stage: static analysis
  before_script:
    - !reference [ .flutter, before_script ]
    - bash utils/ci/codemagic/bin/configure_font_awesome_gitlab_access.sh
    # Without resolved dependencies the formatter can't resolve the
    # analysis_options include and silently ignores the `formatter:` settings.
    - dart pub get
  script:
    - dart format . --set-exit-if-changed

analyze:
  extends: .flutter
  stage: static analysis
  before_script:
    - !reference [ .flutter, before_script ]
    - bash utils/ci/codemagic/bin/configure_font_awesome_gitlab_access.sh
    - dart pub get
    - curl -fsSL "https://github.com/phrase/phrase-cli/releases/latest/download/phrase_linux_amd64" -o /usr/local/bin/phrase && chmod +x /usr/local/bin/phrase
    - phrase pull -t "$PHRASE_ACCESS_TOKEN"
    - bash utils/bin/pigeon.sh
    - dart run build_runner build --delete-conflicting-outputs
    - touch .env
  script:
    - dart analyze . --fatal-infos --fatal-warnings

gitlab-ci-flutter-version-matches-codemagic:
  stage: static analysis
  image: dart:latest
  script:
    - gitlab_ci_version=$(grep -oE 'gmeligio/flutter-android:[0-9]+\.[0-9]+\.[0-9]+' .gitlab-ci.yml | cut -d':' -f2)
    - codemagic_version=$(grep -E '^ *flutter:' codemagic.yaml | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
    - echo ".gitlab-ci.yml image => $gitlab_ci_version, codemagic.yaml => $codemagic_version"
    - |
      if [ -z "$gitlab_ci_version" ] || [ -z "$codemagic_version" ] || [ "$gitlab_ci_version" != "$codemagic_version" ]; then
        echo "===ERROR==="
        echo "The Flutter version in the .gitlab-ci.yml image tag must match the flutter version in codemagic.yaml."
        exit 1
      fi

# Verifies the support and privacy policy URLs configured for each brand
# still resolve. Only warns (allow_failure) since an outage of an external
# site shouldn't block merging.
check-brand-urls:
  stage: static analysis
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/python:3.12
  allow_failure: true
  script:
    - |
      python3 - <<'PY'
      import glob
      import json
      import sys
      import urllib.request

      failed = False
      for path in sorted(glob.glob("brands/*.json")):
          with open(path) as file:
              config = json.load(file)
          brand = config.get("identifier", path)
          for key in ("supportUrl", "supportUrlNL", "privacyPolicyUrl"):
              url = config.get(key, "")
              if not url:
                  print(f"[{brand}] {key} not set, skipping")
                  continue
              # Some sites reject requests without a browser-like user agent.
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      print(f"[{brand}] {key} OK ({response.status}): {url}")
              except Exception as error:
                  print(f"WARNING: [{brand}] {key} failed ({error}): {url}")
                  failed = True

      if failed:
          print("One or more brand URLs did not resolve (see warnings above).")
          sys.exit(1)
      PY

build & test:
  image: dart:latest
  stage: build and test
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"'
      variables:
        CODEMAGIC_WORKFLOW: "gitlab-ci-merge-request"
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"'
      variables:
        CODEMAGIC_WORKFLOW: "gitlab-ci-merge-request"
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      variables:
        CODEMAGIC_WORKFLOW: "gitlab-ci-merge-train"
  artifacts:
    when: always
    reports:
      junit: "test_results/**/test_result_*.xml"
  before_script:
    # Prepare SSH
    - 'command -v ssh-agent >/dev/null || (apt-get update -y && apt-get install openssh-client -y)'
    - eval $(ssh-agent -s)
    - echo "$FONT_AWESOME_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
    - cd ./utils/ci/gitlab
    - dart pub get
  script:
    - dart ./bin/remove_build_url.dart
    - dart ./bin/build_via_codemagic.dart
