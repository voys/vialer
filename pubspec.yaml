name: vialer
publish_to: none
description: >-
  Mobile app that serves as both a VoIP client
  and a management tool for accounts on the VoIPGRID platform.
version: 7.0.0

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.47.0 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_phone_lib: 1.0.4
  # This points to our fork of the Font Awesome Flutter library which includes our pro-icons so must
  # be kept private.

  # To access this without SSH authentication (i.e. CI/CD pipelines) we must rewrite
  # the URL (see `utils/ci/codemagic/bin/configure_font_awesome_gitlab_access.sh` for more info)
  # which requires a Gitlab access token.

  # `FONT_AWESOME_GITLAB_ACCESS_TOKEN` expires every year, next time on Fri 9 Jul 2027.

  # 1. Issue a new token: mobile/libraries/font-awesome/-/settings/access_tokens
  # 2. Update Gitlab CI/CD variables: /groups/mobile/-/settings/ci_cd#ci-variables
  # 3. Update Codemagic variables: Global variables and secrets -> `team_shared_environment`
  font_awesome_flutter:
    git:
      url: git@gitlab.wearespindle.com:mobile/libraries/font-awesome.git
      ref: 93e5777a48f1a804559acec3b4cf2dc14d9b5b1b
  flutter_bloc: ^9.1.1
  provider: ^6.1.5
  equatable: ^2.0.8
  chopper: ^8.5.0
  shared_preferences: ^2.5.4
  flutter_svg: ^2.2.3
  android_intent_plus: ^6.0.0
  permission_handler: ^12.0.1
  url_launcher: ^6.3.2
  characters: ^1.3.0
  diacritic: ^0.1.5
  scrollable_positioned_list: ^0.3.8
  i18n: ^4.1.0
  intl: ^0.20.2
  flutter_dotenv: ^6.0.0
  sentry_flutter: ^9.9.2
  flutter_segment_sdk: ^3.13.5
  package_info_plus: ^9.0.0
  sqlite3_flutter_libs: ^0.5.41
  path_provider: ^2.1.2
  path: ^1.9.0
  timezone: ^0.11.0
  logging: ^1.2.0
  get_it: ^9.2.0
  dartx: ^1.2.0
  connectivity_plus: ^7.0.0
  flutter_inappwebview: ^6.1.5
  json_annotation: ^4.8.1
  flutter_rating_bar: ^4.0.1
  flutter_libphonenumber: ^2.7.0
  styled_text: ^8.1.0
  flutter_switch: ^0.3.2
  in_app_review: ^2.0.11
  synchronized: ^3.4.0
  duration: ^4.0.3
  flutter_keyboard_visibility: ^6.0.0
  recase: ^4.1.0
  watcher: ^1.2.1
  freezed_annotation: ^3.1.0
  collection: ^1.18.0
  flutter_platform_widgets: ^9.0.0
  search_highlight_text: ^1.0.0+2
  auto_size_text: ^3.0.0
  flutter_riverpod: ^3.1.0
  flutter_contacts: ^1.1.7+1
  connection_network_type: ^1.0.0
  timer_builder: ^2.0.0
  gap: ^3.0.1
  injectable: ^2.7.1
  dev: ^1.0.0
  injectable_generator: ^2.9.1
  device_info_plus: ^12.3.0
  country_codes: ^3.3.0
  res_client:
    git:
      url: https://github.com/jeremynorman89/resclient-dart.git
      ref: main
  expandable_page_view: ^1.2.0
  upgrader: ^12.3.0

  riverpod_annotation: any
  meta: any
  http: any
dev_dependencies:
  test: ^1.24.9
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  build_runner: ^2.10.4
  chopper_generator: ^8.5.0
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.4
  pigeon: ^26.1.5
  xml: ^6.6.1
  basic_utils: ^5.7.0
  yaml: ^3.1.2
  yaml_edit: ^2.2.3
  glob: ^2.1.2
  package_config: ^2.2.0
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0
  mockito: ^5.4.4
  flutter_lints: ^6.0.0

  # Nested package that contains all code generation, this means the configuration can be stored
  # in `vialer_generators/build.yaml`.
  vialer_generators:
    path: vialer_generators

  args: any
dependency_overrides:
  build: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/background_cloud.svg
    - assets/survey/help.png
    - assets/survey/yay.png

  fonts:
    - family: 'BrandIcons'
      fonts:
        - asset: assets/brand_icons.ttf
